<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<script>/* 사파리는 user-scalable=no 를 무시 — 두 손가락·두 번 탭 확대를 직접 막는다 */for(const e of ['gesturestart','gesturechange'])document.addEventListener(e,ev=>ev.preventDefault(),{passive:false});document.addEventListener('touchmove',ev=>ev.touches.length>1&&ev.preventDefault(),{passive:false});</script>
<style>html{touch-action:manipulation;-webkit-text-size-adjust:100%}</style>
<meta name="theme-color" content="#000000">
<title>딸깍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Cinzel:wght@400&family=Oswald:wght@300;400&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
/*
  배치 규칙: 사용자 시안(375×1015 기준)에서 잰 좌표를 그대로 쓴다.
  --sx = 가로 배율, --sy = 세로 배율, --s = 둘 중 작은 값(크기용). JS layout() 이 넣는다.
  .a  : left=--x·sx, top=--y·sy, width=--w·sx, height=--h·s
  .xc : --x 가 가운데 x   .yc : --y 가 가운데 y   .cx : 가로 가운데
  .ws : 폭도 s 로(정사각 그림)   .hy : 높이를 sy 로(큰 영역)
  글자는 data-cy(글자 가운데 y)·data-h(글자 높이)·data-w(글자 폭)로 JS 가 크기·자간을 맞춘다.
*/
/* 색은 시안에서 직접 뽑은 값 */
:root{--bg:#000;--red:#b3191f;--lab:#bd5357;--btn:#47100f;--white:#efebe6;--dim:#8c8c8c;--ease:cubic-bezier(.2,.8,.2,1);--snap:cubic-bezier(.7,0,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{color:var(--white);font-family:'Noto Serif KR',serif;font-weight:300;-webkit-text-size-adjust:100%;text-size-adjust:100%;user-select:none}
#col{position:absolute;top:0;overflow:visible}
.screen{position:absolute;inset:0;display:none}.screen.on{display:block}
.a{position:absolute;left:calc(var(--x,0) * var(--sx) * 1px);top:calc(var(--y,0) * var(--sy) * 1px);
   width:calc(var(--w) * var(--sx) * 1px);height:calc(var(--h) * var(--s) * 1px)}
.ws{width:calc(var(--w) * var(--s) * 1px)}
.hy{height:calc(var(--h) * var(--sy) * 1px)}
.xc{left:calc(var(--x) * var(--sx) * 1px - var(--w) * var(--s) * .5px)}
.xc:not(.ws){left:calc(var(--x) * var(--sx) * 1px - var(--w) * var(--sx) * .5px)}
.cx{left:calc(50% - var(--w) * var(--sx) * .5px)}.cx.ws{left:calc(50% - var(--w) * var(--s) * .5px)}
.yc{top:calc(var(--y) * var(--sy) * 1px - var(--h) * var(--s) * .5px)}
.t{position:absolute;white-space:nowrap;transform-origin:0 50%}
.f-di{font-family:'Bodoni Moda',serif;font-weight:400}.f-ci{font-family:'Cinzel',serif}.f-os{font-family:'Oswald',sans-serif;font-weight:300}.f-kr4{font-weight:400}
.red{color:var(--lab)}.dim{color:var(--dim)}.dim2{color:#7b7b7a}.dim3{color:#5f5f5f}.lite{color:#b0b0b0}
img{display:block}

/* 등장 */
.in{opacity:0;animation:in .9s var(--ease) forwards;animation-delay:var(--d,0s)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade 1.2s ease forwards;animation-delay:var(--d,0s)}
@keyframes fade{to{opacity:1}}

/* 버튼 */
.btn{display:flex;align-items:center;justify-content:center;border:none;background:var(--btn);color:var(--white);font:400 calc(15px * var(--s)) 'Noto Serif KR',serif;letter-spacing:.08em;cursor:pointer;overflow:hidden}
.btn::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,#ffffff14 50%,transparent 65%);translate:-100% 0;animation:sheen 5s ease-in-out infinite 2.5s}
@keyframes sheen{0%,72%{translate:-100% 0}100%{translate:100% 0}}
.btn:active{filter:brightness(1.25)}
.btn.line{background:none;border:1px solid #2b2b2b}.btn.line::before{display:none}

/* 화면 전환 붓 */
/* 화면 전환: 시안 붓 결이 묻은 검붉은 붓 두 줄이 차례로 쓸고 지나감 */
#wipe{position:fixed;inset:-20% -60%;z-index:50;pointer-events:none;transform:translateX(-115%) skewX(-18deg);
  background:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
#wipe::before,#wipe::after{content:"";position:absolute;inset:0;
  background:url(img/box.png) center/cover,linear-gradient(90deg,transparent,#3a0608 15%,#8a1519 45%,#b3191f 55%,#5a0a0d 75%,transparent);
  background-blend-mode:screen;opacity:.95}
#wipe::after{left:22%;right:-22%;background:url(img/paint3.png) center/cover,linear-gradient(90deg,transparent,#120202 20%,#2a0507 60%,transparent);opacity:.9}
#wipe.go{animation:wipe .9s var(--snap) forwards}
@keyframes wipe{to{transform:translateX(115%) skewX(-18deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}

/* 누를 때 번지는 잉크 (버튼·매칭 상자) */
.rip{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#ffffff38 0%,#b3191f30 40%,transparent 70%);
  translate:-50% -50%;scale:0;animation:rip .65s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rip{to{scale:1;opacity:0}}
.shock{position:absolute;z-index:30;border:2px solid #e0303a;border-radius:50%;translate:-50% -50%;pointer-events:none;animation:shock .9s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes shock{from{width:0;height:0;opacity:1}to{width:calc(900px * var(--s));height:calc(900px * var(--s));opacity:0;border-width:1px}}

/* ═══ 1 */
/* 로고: 붉은 잉크가 번졌다가 가라앉으며 글자가 선다 */
.logo span{display:inline-block;opacity:0;animation:ink 1.7s var(--ease) forwards}
@keyframes ink{0%{opacity:0;filter:blur(14px);transform:scale(1.14);text-shadow:0 0 30px #b3191f}
  45%{opacity:1;filter:blur(2px);text-shadow:0 0 18px #b3191f99}100%{opacity:1;filter:none;transform:none;text-shadow:0 0 0 transparent}}
/* 아래 붓: 왼쪽 아래에서 대각선으로 칠해짐 */
.brush1{clip-path:polygon(0 100%,0 100%,0 100%);animation:stroke1 1.1s cubic-bezier(.7,0,.2,1) 2.2s forwards}
@keyframes stroke1{to{clip-path:polygon(0 100%,0 -100%,200% 100%)}}
/* 작은 악마: 나타날 때 눈이 두 번 깜빡 */
.flick{opacity:0;animation:fade 1s ease var(--d) forwards,flick .8s steps(1) calc(var(--d) + .5s)}
@keyframes flick{0%{opacity:1}20%{opacity:.25}35%{opacity:1}55%{opacity:.35}70%,100%{opacity:1}}
.pin div .dg{display:inline-block}
.pin.done div{animation:wave .8s var(--ease) calc(var(--i) * .07s)}
@keyframes wave{35%{border-color:#e0303a;box-shadow:0 0 14px #e0303a55}100%{border-color:#4a4545}}
.tagline{clip-path:inset(0 100% 0 0);animation:reveal 1.5s steps(24) 1.1s forwards}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
.pin{display:flex;gap:calc(6px * var(--sx))}
.pin div{flex:1;border:1px solid #3a3636;display:grid;place-items:center;font:400 calc(24px * var(--s)) 'Bodoni Moda',serif;color:var(--white);transition:border-color .3s}
.pin div.cur::after{content:"";width:1.5px;height:calc(26px * var(--s));background:var(--red);animation:caret 1.05s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.pin div.hit{animation:hit .45s var(--ease)}
@keyframes hit{0%{border-color:#e0303a;box-shadow:0 0 14px #e0303a77}100%{border-color:#4a4545}}
.dash{background:var(--red)}

/* ═══ 2 */
.mode{color:#3d3d3d;transition:color .5s;cursor:pointer}.mode.on{color:var(--white)}
/* 모드 글자: 아래에서 잘려 올라오듯 드러남 (MATCH FOUND 와 같은 결) */
.rise2{animation:rise2 .85s var(--snap) both;animation-delay:var(--d)}
@keyframes rise2{from{clip-path:inset(0 0 100% 0);transform:translateY(35%)}to{clip-path:inset(-30% -10% -30% -10%);transform:none}}
/* 매칭 상자: 안의 붓이 쓸리며 드러나고, 이후 아주 천천히 숨 쉬듯 움직임 */
.box img{animation:boxin 1.1s var(--snap) .6s both,drift 16s ease-in-out 1.8s infinite alternate}
@keyframes boxin{from{clip-path:inset(0 100% 0 0);transform:scale(1.1)}to{clip-path:inset(0);transform:none}}
@keyframes drift{to{transform:scale(1.07) translate(-2%,1.5%)}}
.box::after{content:"";position:absolute;inset:0;border:1px solid #e0303a;opacity:0;pointer-events:none}
.box.searching::after{animation:bpulse 1.6s ease-in-out infinite}
@keyframes bpulse{50%{opacity:1;box-shadow:inset 0 0 calc(40px * var(--s)) #b3191f40}}
/* 고른 모드 밑 세부 큐 (솔랭·자랭 / 칼바람·아레나… / TFT 랭크·더블업…) */
/* 옆으로 넘기기: 가운데 온 것이 선택. 양 끝은 흐려짐 */
.subq{position:absolute;left:0;right:0;display:flex;gap:calc(24px * var(--s));padding:0 50%;font-size:calc(21px * var(--s));color:#5f5f5f;
  overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x;
  -webkit-mask:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);transition:top .6s var(--snap)}
.subq::-webkit-scrollbar{display:none}
.subq.lock{overflow-x:hidden;pointer-events:none}
.subq span{padding:calc(7px * var(--s)) calc(2px * var(--s));cursor:pointer;position:relative;transition:color .3s,scale .3s;white-space:nowrap;scroll-snap-align:center;scale:.88}
.subq span.on{color:var(--white);scale:1}
.mode{transition:color .5s,translate .6s var(--snap)}
.credit{position:absolute;left:0;right:0;top:calc(998px * var(--sy));text-align:center;font-size:calc(8px * var(--s));letter-spacing:.2em;color:#3d3d3d;pointer-events:none;z-index:5}
.subq span.on::after{content:'';position:absolute;left:50%;bottom:calc(1px * var(--s));width:calc(16px * var(--s));height:calc(2px * var(--s));margin-left:calc(-8px * var(--s));background:var(--red)}
.nopos{position:absolute;left:0;right:0;text-align:center;font-size:calc(15px * var(--s));line-height:1.9;color:var(--dim);top:calc(495px * var(--sy));display:none}
.nopos b{display:block;font-family:'Oswald',sans-serif;font-weight:300;letter-spacing:.3em;color:var(--white);font-size:calc(26px * var(--s))}
.s2.nopos-on .nopos{display:block}.s2.nopos-on #roles,.s2.nopos-on #rul{display:none}
.uline{background:var(--red);transition:top .6s var(--snap),left .6s var(--snap)}
.divider{background:#1e1c1c;width:1px!important}
.role{cursor:pointer}
.num{color:var(--dim);transition:color .4s}.num.on{color:var(--white)}.num.p2{color:#d98a8e}
.role.p2{filter:drop-shadow(0 0 6px #b3191f88)}
#rul{display:none}
.ptabs{position:absolute;left:0;right:0;top:calc(476px * var(--sy));display:flex;justify-content:center;gap:calc(12px * var(--s))}
.ptabs button{width:calc(150px * var(--sx));height:calc(46px * var(--sy));background:#0b0909;border:1px solid #3a3636;color:var(--white);font:inherit;font-size:calc(17px * var(--s));display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.ptabs button small{font-size:calc(12px * var(--s));color:#8c8c8c}
.s2:not(.pick-open) #roles .role,.s2:not(.pick-open) #roles .num,.s2:not(.pick-open) #roles .divider{display:none}
.ptabs button.on{border-color:var(--red);color:var(--white);background:#1a0607}.ptabs button.on small{color:#d98a8e}
.ptabs button:disabled{opacity:.3}
.box{border:1px solid #3a1216;overflow:hidden;cursor:pointer}
.box img{width:100%;height:100%;object-fit:cover}
.box.searching{border-color:var(--red)}
.box .ring{position:absolute;left:50%;top:50%;width:calc(150px * var(--s));aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:1px solid transparent;border-top-color:#e0303a;opacity:0;transition:opacity .4s;animation:spin 1.4s linear infinite}
.box.searching .ring{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══ 3 */
.s3 .flash{position:absolute;inset:0;background:#b3191f;z-index:40;pointer-events:none;opacity:0}
.s3.play .flash{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:.6}100%{opacity:0}}
.big{font-variation-settings:'opsz' 20;/* 큰 글자 기본(opsz 96)은 가는 획이 폰에서 사라짐 → 작은 광학 크기로 획을 두껍게 */background:linear-gradient(180deg,#fff 0%,#e4dfda 55%,#a7a19c 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.s3.play .big{clip-path:inset(0 0 100% 0);animation:rise .9s var(--snap) forwards}
.s3.play .big.b2{animation-delay:.2s}
@keyframes rise{to{clip-path:inset(0 0 0 0)}}
/* 시안의 붓: 오른쪽 위에서 왼쪽 아래로 쫙 */
.s3.play .paint3{animation:sweep .8s cubic-bezier(.75,0,.2,1) .15s both}
@keyframes sweep{from{clip-path:polygon(100% 0,100% 0,100% 0)}to{clip-path:polygon(-100% 0,100% 0,100% 200%)}}
.paint3{object-fit:fill;mix-blend-mode:lighten;
  -webkit-mask:radial-gradient(ellipse 82% 74% at 52% 48%,#000 78%,transparent 100%);mask:radial-gradient(ellipse 82% 74% at 52% 48%,#000 78%,transparent 100%)}
/* 악마: 불 한가운데서 아래→위로 스르륵 */
.dvw{transform-origin:50% 100%}
.s3.play .dvw{animation:emerge 1.1s cubic-bezier(.3,.6,.3,1) 1.25s both}
@keyframes emerge{0%{opacity:0;transform:translateY(18%) scale(.92);filter:blur(3px) brightness(3) sepia(1) saturate(6) hue-rotate(-25deg)}
  55%{opacity:.9;filter:blur(1px) brightness(1.6) sepia(.6) saturate(3) hue-rotate(-20deg)}100%{opacity:1;transform:none;filter:none}}
.dvw img{width:100%}
.eyeglow{position:absolute;left:25%;top:62%;width:50%;height:12%;border-radius:50%;background:radial-gradient(#ffe6e0aa,#ff5a4a33 45%,transparent 72%);filter:blur(2px);mix-blend-mode:screen;opacity:0}
.s3.play .eyeglow{animation:ignite .9s ease-out 2.3s both}
@keyframes ignite{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(2.4,1.8)}100%{opacity:.7;transform:none}}
.fire{mix-blend-mode:screen;pointer-events:none}
.count{background:linear-gradient(90deg,#c84f58 0%,#b5444c 45%,#7f2f35 75%,#6e282d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 calc(24px * var(--s)) #b3191f66)}
.count.urgent{filter:brightness(1.4) drop-shadow(0 0 calc(30px * var(--s)) #ff3b4599)}
.slash{background:linear-gradient(transparent,#c0272f,transparent);width:1px!important;transform-origin:50% 50%}
.accepted{filter:brightness(1.4);box-shadow:0 0 0 1px #e0303a,0 0 30px #e0303a66}

/* ═══ 4 */
.track{background:#2a2727}.track i{position:absolute;inset:0;background:var(--red);transform-origin:left;transition:transform 1s linear}
/* 흑백은 그림 층(::before)에만 — 금지 표시·선택 테두리는 빨강 그대로 */
.portrait{position:relative;background:#141212;border:1px solid #1d1d1d}
.portrait.a{position:absolute}
.portrait::before{content:"";position:absolute;inset:0;background:var(--img) center/cover;filter:grayscale(1) contrast(1.15) brightness(.7);transition:filter .4s}
.ban::after{content:"";position:absolute;right:6%;bottom:5%;width:24%;aspect-ratio:1;border:1.5px solid #e0303a;border-radius:50%;
  background:linear-gradient(135deg,transparent 44%,#e0303a 44% 56%,transparent 56%);animation:stamp .4s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--d) + .5s)}
@keyframes stamp{from{opacity:0;transform:scale(2)}}
/* 밴 칸: 카드 뒤집듯 등장 */
.flipin{animation:flipin .7s var(--ease) both;animation-delay:var(--d)}
@keyframes flipin{from{opacity:0;transform:perspective(420px) rotateY(80deg)}to{opacity:1;transform:none}}
/* 내 줄 테두리: 왼쪽에서 그어짐 · 악마: 테두리 뒤에서 빼꼼 */
.drawbox{animation:drawbox .8s var(--snap) both;animation-delay:var(--d)}
@keyframes drawbox{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
.peek{opacity:0;animation:peek .7s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--d)}
@keyframes peek{from{opacity:0;transform:translateX(-55%) rotate(-12deg)}to{opacity:1;transform:none}}
.ico{border-radius:50%;border:1px solid #3a3636;display:grid;place-items:center;background:#000 center/cover}
.ico img{width:62%}
.mebox{border:1px solid var(--red);background:linear-gradient(90deg,#1a0607,transparent 85%)}
.search{border:1px solid #3a3636;display:flex;align-items:center;gap:calc(8px * var(--s));padding-left:calc(12px * var(--s));font-size:calc(11.5px * var(--s));color:var(--dim)}
.search svg{width:calc(14px * var(--s));height:calc(14px * var(--s))}
.grid{display:grid;grid-template-columns:repeat(3,1fr);column-gap:calc(11px * var(--sx));row-gap:calc(14px * var(--sy));align-content:start;overflow-y:auto;scrollbar-width:none}
.grid::-webkit-scrollbar{display:none}
.grid .portrait{aspect-ratio:51/68;cursor:pointer;transition:border-color .3s}
.grid .portrait.sel{border-color:#c4454b;box-shadow:0 0 0 1px #c4454b,0 0 14px #c4454b55}
.grid .portrait.sel::before{filter:grayscale(.5) contrast(1.1)}
.grid .portrait.lock{animation:lock .9s var(--ease) forwards}.grid .portrait.lock::before{filter:none}
@keyframes lock{0%{box-shadow:0 0 0 1px #fff,0 0 0 0 #e0303acc}100%{box-shadow:0 0 0 1px #e0303a,0 0 0 20px #e0303a00}}
</style>
</head>
<body>
<div id="col">

<!-- ═══ 1. 연결 -->
<section class="screen s1" data-s="1">
  <div class="t logo" data-cy="250" data-h="56" data-w="112"><span>딸</span><span style="animation-delay:.25s">깍</span></div>
  <div class="t f-ci red tagline" data-cy="308" data-h="7" data-w="198">MATCH. CLICK. DOMINATE.</div>
  <img class="a ws xc yc flick" src="img/devil-cut.png" alt="" style="--x:187.5;--y:390;--w:30;--h:31;--d:1.8s">
  <div class="t dim in" data-cy="500" data-h="13" style="--d:1.4s">접속 코드를 입력하세요</div>
  <div class="a cx pin in" id="pin" style="--y:525;--w:312;--h:60;--d:1.6s"><div class="cur"></div><div></div><div></div><div></div><div></div><div></div></div>
  <button class="a cx btn in" id="connect" style="--y:692;--w:296;--h:64;--d:1.9s">연결하기</button>
  <div class="t lite in" data-cy="815" data-h="15" style="--d:2.1s">QR 스캔</div>
  <div class="a cx dash in" style="--y:862;--w:15;--h:1.5;--d:2.2s"></div>
  <img class="a hy brush1" src="img/brush1.png" alt="" style="--x:2;--y:875;--w:366;--h:134;object-fit:fill">
</section>

<!-- ═══ 2. 매칭 시작 -->
<section class="screen s2" data-s="2">
  <div class="t dim in" id="pcline" data-cy="74" data-h="13" style="font-size:1px;display:none">PC 로비 그대로 · 파티 3명</div>
  <div class="t f-di red in" data-cy="84" data-h="15">01</div>
  <div class="t dim2 in" data-cy="116" data-h="15">게임 모드 선택</div>
  <div class="t f-os mode rise2" data-cy="218" data-h="36" data-w="180" data-i="0" style="--d:.1s">RANKED</div>
  <div class="t f-os mode rise2" data-cy="282" data-h="36" data-w="180" data-i="1" style="--d:.15s">NORMAL</div>

<script>
const col = document.getElementById('col');
const S = {};
const meas = document.createElement('canvas').getContext('2d');

// ── 글자 맞춤: 시안의 글자 높이(data-h)·폭(data-w)·가운데 y(data-cy)·왼쪽 x(data-x)
function fitText(el) {
  const d = el.dataset, cs = getComputedStyle(el), txt = el.textContent;
  meas.font = `${cs.fontWeight} 100px ${cs.fontFamily}`;
  const m = meas.measureText(txt);
  const gh = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent || 70;
  const fs = (+d.h * S.s) / gh * 100, k = fs / 100;
  const gw = (m.actualBoundingBoxLeft + m.actualBoundingBoxRight) * k;
  let ls = 0, sc = 1;
  if (d.w) {
    // 자간 맞춤은 글자 크기와 같은 배율(s), 폭을 꽉 채우는 큰 제목(가로 늘림)만 화면 폭 배율(sx)
    const tw = +d.w * (d.m === 's' ? S.sx : S.s);
    if (d.m === 's') sc = tw / gw;
    else if (txt.length > 1) ls = (tw - gw) / (txt.length - 1);
  }
  Object.assign(el.style, {
    fontSize: fs + 'px', lineHeight: (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent) / 100,
    letterSpacing: ls + 'px', scale: sc === 1 ? '' : `${sc} 1`,
    top: (+d.cy * S.sy - m.fontBoundingBoxAscent * k + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2 * k) + 'px',
  });
  // 폰의 글꼴 확대 설정(안드로이드 등)이 글자를 키우면 되돌린다 — 시안 배치가 우선
  const got = parseFloat(getComputedStyle(el).fontSize);
  if (got && Math.abs(got / fs - 1) > .02) el.style.fontSize = fs * fs / got + 'px';
  const full = (gw + ls * (txt.length - 1)) * sc;
  const x0 = d.x != null ? +d.x * S.sx : (d.cx != null ? +d.cx : 187.5) * S.sx - full / 2;
  el.style.left = (x0 + m.actualBoundingBoxLeft * k * sc) + 'px';
  el.glyph = { l: x0, r: x0 + full, t: +d.cy * S.sy - gh * k / 2, b: +d.cy * S.sy + gh * k / 2 }; // 배치 검사용 실제 글자 범위
}
window.S = S; window.fitText = fitText;
function setText(el, t, w) { el.textContent = t; if (w === null) delete el.dataset.w; else if (w) el.dataset.w = w; fitText(el); }

// ── 화면 맞춤: 가로는 폭 비례, 세로는 높이 비례 (스크롤 없음). 태블릿·PC 는 가운데 폰 폭 기둥
function layout() {
  let W = window.visualViewport?.width || innerWidth, H = window.visualViewport?.height || innerHeight;
  if (!W || !H) { if (S.sx) return; W = 393; H = 852; } // 숨겨진 창 등 크기 0 → 이전 배치 유지(처음이면 기본 폰 크기)
  if (S.sx && W === S.W && H < S.H && document.activeElement?.matches('input')) return; // 폰 키보드가 올라와 높이만 줄면 화면 전체를 다시 맞추지 않음
  Object.assign(S, { W, H });
  const cw = Math.min(W, H * .56);
  Object.assign(S, { sx: cw / 375, sy: H / 1015 });
  S.s = Math.min(S.sx, S.sy);
  col.style.cssText = `left:${(W - cw) / 2}px;width:${cw}px;height:${H}px;--sx:${S.sx};--sy:${S.sy};--s:${S.s}`;
  document.querySelectorAll('.t').forEach(fitText);
}

// ── 화면 전환 (붉은 붓 와이프)
const screens = [...document.querySelectorAll('.screen')];
const wipe = document.getElementById('wipe');
const onEnter = {};
function show(n, animate = true) {
  const swap = () => {
    screens.forEach(s => s.classList.toggle('on', s.dataset.s == n));
    const el = screens[n - 1];
    el.querySelectorAll('*').forEach(e => { if (getComputedStyle(e).animationName !== 'none') { e.style.animation = 'none'; e.offsetWidth; e.style.animation = ''; } });
    onEnter[n]?.(el);
    el.querySelectorAll('.t').forEach(fitText);
  };
  if (!animate) return swap();
  wipe.classList.remove('go'); wipe.offsetWidth; wipe.classList.add('go');
  setTimeout(swap, 380);
}
const img = c => `champs/${c}.png`;

// ═══ 1. 연결: 코드가 한 자리씩 들어오는 시연
const pin = [...document.querySelectorAll('#pin div')];
const pinBox = document.getElementById('pin'), connectBtn = document.getElementById('connect');
pin.forEach((d, i) => d.style.setProperty('--i', i));
onEnter[1] = () => {
  pin.forEach(d => (d.textContent = '', d.className = ''));
  pinBox.classList.remove('done');
  pin[0].className = 'cur';
  [3, 9, 4, 1, 2, 7].forEach((v, i) => setTimeout(() => {
    pin[i].className = 'hit'; pin[i].innerHTML = `<span class="dg">${v}</span>`;
    // 숫자가 위에서 떨어지며 선명해진다
    pin[i].firstChild.animate([{ opacity: 0, transform: 'translateY(-45%)', filter: 'blur(3px)' }, { opacity: 1, transform: 'none', filter: 'none' }],
      { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1)' });
    if (pin[i + 1]) pin[i + 1].className = 'cur';
    if (i === 5) { // 다 들어오면 칸들이 차례로 붉게 물결 → 버튼이 두 번 숨쉼
      pinBox.classList.add('done');
      connectBtn.animate([{ boxShadow: '0 0 0 0 #0000' }, { boxShadow: '0 0 0 1px #c4454b, 0 0 24px #b3191f66' }, { boxShadow: '0 0 0 0 #0000' }],
        { duration: 1100, delay: 450, iterations: 2, easing: 'ease-in-out' });
    }
  }, 2600 + i * 260));
};
connectBtn.onclick = () => setTimeout(() => show(2), 180);

// ── 누를 때 잉크 번짐 (버튼·매칭 상자 공통)
addEventListener('pointerdown', e => {
  const b = e.target.closest('.btn,.box'); if (!b || document.body.classList.contains('editing')) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2;
  const rip = document.createElement('span'); rip.className = 'rip';
  Object.assign(rip.style, { left: e.clientX - r.left + 'px', top: e.clientY - r.top + 'px', width: d + 'px', height: d + 'px' });
  b.append(rip); setTimeout(() => rip.remove(), 700);
  b.animate([{ scale: 1 }, { scale: .985 }, { scale: 1 }], { duration: 260, easing: 'ease-out' });
});

// ═══ 2. 모드·포지션·매칭
const modes = [...document.querySelectorAll('.mode')];
// 클라이언트 16개 모드 (사용자 조사 11/23, LoL 26.23 · TFT 18.7). flow = 수락 뒤 흐름:
//   draft 밴픽(인트로→희망→금지→선택→장비) · tour 5인 랭크(전략→3밴→3픽→2밴→2픽) · classic 클래식 선택
//   aram 카드·벤치 · arena 의사표시→동시 금지→선택 · swift 로비에서 미리 고름 · tft 바로 로딩 · pve 수락 없이 바로 시작
// shortcut: 큐 번호·목록은 이 PC 시연용. 실제 앱은 LCU 큐 목록(지금 열린 것만)으로 채우고, 화면은 챔프 선택 상태 모양으로 고름
const QUEUES = [
  [{ id: 420, n: '솔로/2인', pos: 1, flow: 'draft' }, { id: 440, n: '자유', pos: 1, flow: 'draft' },
   { id: 4205, n: '5인', pos: 1, flow: 'tour', party: 5 }],
  [{ id: 480, n: '신속 대전', pos: 1, flow: 'swift' }, { id: 400, n: '교차 선택', pos: 1, flow: 'draft' },
   { id: 4300, n: '클래식 5대5', pos: 1, flow: 'classic' },
   { id: 450, n: '칼바람', flow: 'aram', note: ['ARAM', '무작위 챔피언 카드 · 팀 벤치 교환'] },
   { id: 2400, n: '아수라장', flow: 'aram', note: ['MAYHEM', '칼바람 + 증강 · 룬 없음'] },
   { id: 1700, n: '아레나', flow: 'arena', team: 2, teams: 8, note: ['ARENA', '2인 1조 · 8팀 · 16명'] },
   { id: 1710, n: '3x6', flow: 'arena', team: 3, teams: 6, note: ['3 × 6', '3인 1조 · 6팀 · 18명'] }],
  [{ id: 1090, n: '일반', flow: 'tft', note: ['TFT', '전략적 팀 전투 · 8인'] }, { id: 1100, n: '랭크', flow: 'tft', note: ['TFT RANKED', '전략적 팀 전투 랭크 · 8인'] },
   { id: 1160, n: '더블 업', flow: 'tft', note: ['DOUBLE UP', '2인 1조 · 4팀 · 체력 공유'] },
   { id: 1210, n: '툭툭이의 시험', flow: 'pve', note: ['TOCKER’S TRIALS', 'PvE · 목숨 3개 · 30 스테이지'] },
   { id: 6000, n: '배불뚝이의 보물', flow: 'tft', until: '2026-12-01', note: ['CHONCC’S TREASURE', '이벤트 · 4~5단계 챔피언으로 시작 · 12/1 까지'] },
   { id: 1091, n: '세트 17', flow: 'tft', note: ['SET 17', 'Space Gods · 신들의 영역'] }],
];
QUEUES.forEach((g, i) => (QUEUES[i] = g.filter(q => !q.until || new Date() < new Date(q.until)))); // 끝난 이벤트 모드는 숨김
let modeI = 0, subI = [0, 0, 0];
const curQ = () => QUEUES[modeI][subI[modeI]];
const subq = document.getElementById('subq'), s2 = document.querySelector('.s2');
const center = (k, smooth) => { const sp = subq.children[k]; subq.scrollTo({ left: sp.offsetLeft + sp.offsetWidth / 2 - subq.clientWidth / 2, behavior: smooth ? 'smooth' : 'instant' }); };
const drawQ = () => {
  const q = curQ();
  [...subq.children].forEach((sp, k) => sp.classList.toggle('on', k === subI[modeI]));
  s2.classList.toggle('nopos-on', !q.pos);
  if (!q.pos) document.getElementById('nopos').innerHTML = `<b>${q.note[0]}</b>${q.note[1]}`;
  setText(document.getElementById('sec2'), q.flow === 'swift' ? '포지션 · 챔피언 미리 고르기' : q.pos ? '포지션 우선순위' : '모드 정보', null);
  window.onQ?.(q);
};
const setMode = i => {
  modeI = i;
  modes.forEach((m, k) => {
    m.classList.toggle('on', k === i);
    m.style.translate = k > i ? '0 calc(62px * var(--sy))' : ''; // 아래 줄을 밀어 세부 줄 자리를 냄
  });
  subq.style.top = `calc(${+modes[i].dataset.cy + modes[i].dataset.h / 2 + 2} * var(--sy) * 1px)`; // 줄 수가 바뀌어도 고른 줄 바로 밑
  subq.innerHTML = QUEUES[i].map((x, k) => `<span data-k="${k}">${x.n}</span>`).join('');
  drawQ(); center(subI[i], false);
};
// 탭하면 가운데로, 손으로 넘기면 멈춘 자리의 가운데 것이 선택
subq.onclick = e => { const k = e.target.dataset?.k; if (k != null) center(+k, true); };
let snapT;
subq.addEventListener('scroll', () => {
  clearTimeout(snapT);
  snapT = setTimeout(() => {
    if (subq.classList.contains('lock')) return center(subI[modeI], true); // 매칭 중엔 제자리로
    const mid = subq.scrollLeft + subq.clientWidth / 2;
    let best = 0, bd = 1e9;
    [...subq.children].forEach((sp, k) => { const d = Math.abs(sp.offsetLeft + sp.offsetWidth / 2 - mid); if (d < bd) { bd = d; best = k; } });
    if (best !== subI[modeI]) { subI[modeI] = best; drawQ(); navigator.vibrate?.(8); }
  }, 90);
});
// 고르면 글자가 한 번 하얗게 빛나며 켜진다
const modeClick = m => (m.onclick = () => { // live.js 가 줄을 새로 만들 때도 씀
  if (go.classList.contains('searching')) return m.animate([{ translate: '0' }, { translate: '-4px' }, { translate: '4px' }, { translate: '0' }], { duration: 260 }); // 매칭 중엔 잠금
  setMode(modes.indexOf(m));
  m.animate([{ textShadow: '0 0 22px rgba(255,255,255,.55)', filter: 'brightness(1.4)' }, { textShadow: '0 0 0 transparent', filter: 'none' }], { duration: 700, easing: 'ease-out' });
});
modes.forEach(modeClick);
setMode(0);

const ROLE_X = [47.5, 103.5, 159.5, 215.5, 271.5, 327.5]; // 탑·정글·미드·원딜·서폿·모두, 가운데 기준 56 간격 (대칭)
document.getElementById('roles').innerHTML = ROLE_X.map((x, i) =>
  `<img class="a ws xc yc role in" data-i="${i}" src="img/role${i + 1}.png" alt="" style="--x:${x};--y:562;--w:36;--h:36;--d:${.35 + i * .05}s">` +
  `<div class="t num in" data-i="${i}" data-cx="${x}" data-cy="604" data-h="15" style="--d:${.4 + i * .05}s">${['탑', '정글', '미드', '원딜', '서폿', '모두'][i]}</div>` +
  (i ? `<div class="a divider" style="--x:${x - 28};--y:540;--h:48"></div>` : '')).join('') +
  // 1지망·2지망을 따로: 고를 칸을 먼저 누르고 포지션을 누름 (롤 클라이언트와 같은 순서)
  `<div class="ptabs" id="ptabs"><button data-slot="0"></button><button data-slot="1"></button></div>`;
const ROLE_NAME = ['탑', '정글', '미드', '원딜', '서폿', '모두'];
let prefs = [0, 1], pslot = 0; // prefs = [1지망, 2지망] (실제로는 PC 로비에서 읽어옴), pslot = 지금 고르는 칸
const drawRoles = () => {
  document.querySelectorAll('.role,.num').forEach(e => {
    const i = +e.dataset.i;
    e.classList.toggle('on', i === prefs[0]); e.classList.toggle('p2', i === prefs[1]);
  });
  document.querySelectorAll('#ptabs button').forEach((b, k) => {
    b.innerHTML = `<small>${k + 1}지망</small>${prefs[k] >= 0 ? ROLE_NAME[prefs[k]] : '없음'}`;
    b.classList.toggle('on', popen && k === pslot); b.disabled = k === 1 && prefs[0] === 5; // 1지망이 모두면 2지망 없음
  });
  document.querySelector('.s2').classList.toggle('pick-open', popen); // 고르기 전엔 버튼 2개만
};
let popen = false;
document.getElementById('roles').onclick = e => {
  const slot = e.target.closest('#ptabs button')?.dataset.slot;
  if (slot != null) { popen = !(popen && pslot === +slot); pslot = +slot; return drawRoles(); }
  const i = +e.target.dataset.i; if (isNaN(i) || i === prefs[pslot]) return;
  const p = [...prefs];
  if (pslot === 0) {
    if (i === p[1]) p[1] = p[0]; // 2지망과 같은 걸 1지망으로 → 서로 바꿈
    p[0] = i;
    if (i === 5) p[1] = -1; else if (p[1] < 0) p[1] = -1;
    if (i !== 5 && p[1] < 0) pslot = 1; // 1지망 정했는데 2지망이 비었으면 2지망으로 이어서
    else popen = false;
  } else {
    if (prefs[0] === 5) return;
    if (i === p[0]) { if (p[1] < 0) return; p[0] = p[1]; } // 1지망과 같은 걸 2지망으로 → 서로 바꿈
    p[1] = i;
    popen = false; // 고르면 다시 버튼 2개만
  }
  prefs = p; drawRoles();
  // 고른 아이콘이 붉게 튀어 오름
  document.querySelector(`.role[data-i="${i}"]`).animate(
    [{ scale: 1 }, { scale: 1.22, filter: 'drop-shadow(0 0 8px #e0303a)' }, { scale: 1, filter: 'none' }], { duration: 480, easing: 'cubic-bezier(.2,.8,.2,1)' });
};
drawRoles();

const go = document.getElementById('go'), goA = document.getElementById('goA'), goB = document.getElementById('goB');
let tick, found;
const mmss = s => `${String(s / 60 | 0).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
// 글자 바뀔 때 흐릿하게 사라졌다 다시 선다
const swapIn = el => el.animate([{ opacity: 0, filter: 'blur(5px)', letterSpacing: `calc(${el.style.letterSpacing} + 6px)` }, { opacity: 1, filter: 'none', letterSpacing: el.style.letterSpacing }],
  { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)' });
// 게임 시작됨: 매칭 상자가 IN GAME 으로 (시연에선 다시 누르면 대기로)
function inGame(msg, wipe = true) {
  if (wipe) show(2);
  go.classList.add('ingame'); setText(goA, 'IN GAME', 150); setText(goB, msg, null); swapIn(goA); swapIn(goB);
}
const idle = () => { go.classList.remove('searching'); subq.classList.remove('lock'); setText(goA, 'MATCH', 140); setText(goB, '매칭 시작', 73); swapIn(goA); swapIn(goB); };
go.onclick = () => {
  clearInterval(tick); clearTimeout(found);
  if (go.classList.contains('ingame')) { go.classList.remove('ingame'); return idle(); } // 시연용: 게임 끝 → 다시 대기
  if (go.classList.contains('searching')) return idle();
  if (curQ().flow === 'pve') return inGame('PvE · 매칭 없이 바로 시작', false); // 툭툭이의 시험: 상대·수락 없음
  if (curQ().flow === 'swift' && !swiftReady()) return; // 신속 대전: 포지션별 챔피언을 먼저 골라야 함
  go.classList.add('searching'); subq.classList.add('lock');
  let s = 0;
  setText(goA, 'SEARCHING', 190); swapIn(goA); requestAnimationFrame(() => swapIn(goB));
  const draw = () => setText(goB, `${mmss(s++)} · 예상 01:30`, null);
  draw(); tick = setInterval(draw, 1000);
  found = setTimeout(() => { clearInterval(tick); idle(); show(3); }, 3500); // 시연: 3.5초 뒤 잡힘
};

// ═══ 3. 매칭 잡힘: 붓 쫙(0.15s) → 악마 자리 불(0.9s~) → 불 속에서 악마 스르륵(1.25s~) → 불 꺼짐(2.5s) → 눈(2.3s)
const nEl = document.getElementById('n');
const fireC = document.getElementById('fire'), fx = fireC.getContext('2d');
let fireRaf, cd;
function startFire() {
  cancelAnimationFrame(fireRaf);
  const W = 400, H = 400, CX = 200, BASE = 380; // 캔버스 400 = 화면 200·s, 악마 발밑
  let parts = [];
  const t0 = performance.now();
  const loop = t => {
    const e = (t - t0) / 1000;
    frame(e, true);
    if (screens[2].classList.contains('on') && (e < 2.5 || parts.length)) fireRaf = requestAnimationFrame(loop); // 꺼지면 멈춤
    else fx.clearRect(0, 0, W, H);
  };
  fireRaf = requestAnimationFrame(loop);
  // 확인용: 연출을 sec 초 시점에 멈춰 보기
  window.__seek3 = sec => {
    cancelAnimationFrame(fireRaf);
    screens[2].getAnimations({ subtree: true }).forEach(a => { a.pause(); a.currentTime = sec * 1000; });
    parts = [];
    for (let e = 0; e <= sec; e += 1 / 60) frame(e, e + 1 / 60 > sec);
  };
  function frame(e, draw) {
    fx.clearRect(0, 0, W, H);
    fx.globalCompositeOperation = 'lighter';
    const power = e < .9 ? 0 : e < 1.1 ? (e - .9) / .2 : e < 1.6 ? 1 : e < 2.5 ? 1 - (e - 1.6) / .9 : 0;
    for (let i = 0; i < power * 6; i++) {
      const spark = Math.random() < .08;
      parts.push({ x: CX + (Math.random() - .5) * 110, y: BASE + (Math.random() - .5) * 10,
        vx: (Math.random() - .5) * (spark ? 1.6 : .35), vy: -(3.2 + Math.random() * 2.8) * (.6 + power * .5) * (spark ? 1.4 : 1),
        life: 0, max: spark ? 30 + Math.random() * 30 : 18 + Math.random() * 16, r: spark ? 1.5 + Math.random() : 7 + Math.random() * 7.5, spark });
    }
    for (const p of parts) {
      p.life++;
      p.x += p.vx + Math.sin((p.life * 3 + p.x) * .05) * (p.spark ? 1 : .65);
      p.y += p.vy; p.vy *= .99;
      const k = p.life / p.max, a = 1 - k;
      if (!draw) continue;
      fx.save(); fx.translate(p.x, p.y);
      if (p.spark) {
        const g = fx.createRadialGradient(0, 0, 0, 0, 0, p.r * 2);
        g.addColorStop(0, `rgba(255,236,190,${a})`); g.addColorStop(1, 'rgba(255,90,20,0)');
        fx.fillStyle = g; fx.beginPath(); fx.arc(0, 0, p.r * 2, 0, 7); fx.fill();
      } else {
        const r = p.r * (1 - k * .8);
        fx.scale(.6, 1.55);
        const g = fx.createRadialGradient(0, 0, 0, 0, 0, r);
        if (k < .3) { g.addColorStop(0, `rgba(255,244,205,${.85 * a})`); g.addColorStop(.4, `rgba(255,160,55,${.55 * a})`); }
        else if (k < .65) { g.addColorStop(0, `rgba(255,${150 - 90 * k | 0},40,${.65 * a})`); g.addColorStop(.4, `rgba(215,38,20,${.4 * a})`); }
        else { g.addColorStop(0, `rgba(170,18,14,${.45 * a})`); g.addColorStop(.4, `rgba(80,5,5,${.25 * a})`); }
        g.addColorStop(1, 'rgba(60,0,0,0)');
        fx.fillStyle = g; fx.beginPath(); fx.arc(0, 0, r, 0, 7); fx.fill();
      }
      fx.restore();
    }
    parts = parts.filter(p => p.life < p.max);
  }
}
onEnter[3] = el => {
  el.classList.remove('play'); el.offsetWidth; el.classList.add('play');
  startFire();
  const acc = document.getElementById('accept'); acc.classList.remove('accepted'); acc.textContent = '수락';
  navigator.vibrate?.([300, 120, 300, 120, 600]);
  let s = 10; nEl.textContent = '10'; nEl.classList.remove('urgent');
  clearInterval(cd);
  cd = setInterval(() => {
    // el.animate 로만: CSS 애니메이션을 갈아끼우면 .in 등장 효과가 풀려 숫자가 투명해짐
    nEl.animate([{}, { opacity: 0, filter: 'blur(5px)' }], { duration: 220, easing: 'ease-in' }).finished.then(() => {
      s = s <= 1 ? 10 : s - 1;
      setText(nEl, String(s).padStart(2, '0'));
      nEl.classList.toggle('urgent', s <= 3);
      nEl.animate([{ opacity: 0, filter: 'blur(5px)' }, {}], { duration: 350, easing: 'cubic-bezier(.2,.7,.2,1)' });
    });
  }, 1000);
};
document.getElementById('accept').onclick = e => {
  const b = e.currentTarget, sc = screens[2], r = b.getBoundingClientRect(), cr = sc.getBoundingClientRect();
  b.classList.add('accepted'); b.textContent = '수락됨';
  clearInterval(cd);
  // 버튼에서 붉은 파동이 퍼지고, 숫자·악마 눈이 한 번 번쩍
  const sh = document.createElement('div'); sh.className = 'shock';
  Object.assign(sh.style, { left: r.left - cr.left + r.width / 2 + 'px', top: r.top - cr.top + r.height / 2 + 'px' });
  sc.append(sh); setTimeout(() => sh.remove(), 950);
  nEl.animate([{ filter: 'brightness(2.2) drop-shadow(0 0 30px #ff3b45)' }, { filter: 'brightness(1)' }], { duration: 700, easing: 'ease-out' });
  sc.querySelector('.eyeglow').animate([{ opacity: 1, transform: 'scale(3,2.2)' }, { opacity: .7, transform: 'none' }], { duration: 700, easing: 'ease-out' });
  // 흐름별 다음 화면: 밴픽형 4 · 칼바람형 5 · 아레나형 6 · 신속 대전·TFT 는 바로 로딩
  setTimeout(() => {
    const f = curQ().flow;
    if (['draft', 'tour', 'classic'].includes(f)) return show(4);
    if (f === 'aram') return show(5);
    if (f === 'arena') return show(6);
    inGame(f === 'tft' ? 'TFT 클라이언트에서 진행' : '게임 로딩 중 · PC 에서 진행');
  }, 900);
};
document.getElementById('decline').onclick = () => {
  clearInterval(cd);
  // 거절: 화면이 잿빛으로 식으며 물러남
  screens[2].animate([{ filter: 'none', opacity: 1 }, { filter: 'grayscale(1) brightness(.5)', opacity: .6 }], { duration: 420, easing: 'ease-in', fill: 'forwards' })
    .finished.then(a => { show(2); setTimeout(() => a.cancel(), 500); });
};

// ═══ 4~6. 챔피언 선택 화면은 modes.js (같은 전역을 씀)
</script>
<script src="modes.js"></script>
<script src="live.js"></script>
<script>

// ── 시작
layout();
addEventListener('resize', layout);
window.visualViewport?.addEventListener('resize', layout);
document.fonts?.ready.then(layout);
document.fonts?.addEventListener?.('loadingdone', layout);
show(Number(new URLSearchParams(location.search).get('s')) || 1, false);
</script>

<script>
// ═══ 편집 모드 (app.html?s=3&edit) — 매칭 잡힘 화면 요소를 끌어서 옮기고 휠로 크기 조절.
// 값은 시안 단위(375×1015)로 localStorage 'ttalkkak-edit-s3' 에 저장 → 확정되면 소스에 옮겨 적는다.
if (new URLSearchParams(location.search).has('edit')) (() => {
  const KEY = 'ttalkkak-edit-s3', scr = screens[2];
  const NAMES = [['.paint3', '붓'], ['#fire', '불'], ['.dvw', '악마'], ['[data-cy="151"]', 'MATCH'], ['[data-cy="278.5"]', 'FOUND'],
    ['[data-cy="437"]', '경기가 발견되었습니다'], ['.slash', '사선'], ['#n', '숫자'], ['[data-cy="663"]', '초'], ['#accept', '수락 버튼'], ['#decline', '거절 버튼']];
  let edits = {};
  try { edits = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
  const st = document.createElement('style');
  st.textContent = `.editing [data-ed]{outline:1px dashed #4aaaff88;cursor:move;pointer-events:auto!important}
    .editing [data-ed].esel{outline:2px solid #4aaaff}
    #edp{position:fixed;left:8px;top:8px;z-index:99;background:#0d0d0dee;color:#ddd;font:12px/1.55 system-ui;padding:9px 11px;border:1px solid #333;border-radius:8px;width:230px}
    #edp b{color:#fff}#edp button{margin:5px 4px 0 0;background:#222;color:#ddd;border:1px solid #444;border-radius:4px;padding:3px 8px;cursor:pointer}
    #edp small{color:#888}`;
  document.head.append(st);
  document.body.classList.add('editing');

  const els = {};
  for (const [q, name] of NAMES) {
    const el = scr.querySelector(q); if (!el) continue;
    el.dataset.ed = name; els[name] = el;
    if (el.classList.contains('t')) el._o = { ...el.dataset };
  }
  const E = n => (edits[n] ||= { dx: 0, dy: 0, k: 1 });
  function apply(name) {
    const el = els[name], e = edits[name] || { dx: 0, dy: 0, k: 1 };
    if (el._o) { // 글자: 시안 좌표(data-*) 자체를 바꾼다
      const o = el._o;
      if (o.x != null) el.dataset.x = +o.x + e.dx; else el.dataset.cx = (o.cx != null ? +o.cx : 187.5) + e.dx;
      el.dataset.cy = +o.cy + e.dy; el.dataset.h = +o.h * e.k; if (o.w) el.dataset.w = +o.w * e.k;
      fitText(el);
    } else {
      el.style.translate = `${e.dx * S.sx}px ${e.dy * S.sy}px`;
      el.style.scale = e.k === 1 ? '' : String(e.k);
    }
  }
  const applyAll = () => Object.keys(els).forEach(apply);
  const save = () => { localStorage.setItem(KEY, JSON.stringify(edits)); panel(); };

  // 정지 화면으로: 카운트다운 멈추고 '07', 연출은 끝 장면
  let scene = 3.6;
  const freeze = () => { clearInterval(cd); __seek3(scene); nEl.className = 't f-di count'; setText(nEl, '07'); applyAll(); };
  setTimeout(freeze, 500);
  document.fonts.ready.then(() => setTimeout(freeze, 300));
  addEventListener('resize', () => setTimeout(applyAll, 50));

  // 버튼 눌림 막기
  scr.addEventListener('click', e => { if (e.target.closest('[data-ed]')) { e.preventDefault(); e.stopImmediatePropagation(); } }, true);

  let sel = null, drag = null;
  const select = n => { Object.values(els).forEach(x => x.classList.toggle('esel', x === els[n])); sel = n; panel(); };
  scr.addEventListener('pointerdown', e => {
    const el = e.target.closest('[data-ed]'); if (!el) return;
    e.preventDefault(); select(el.dataset.ed);
    const ed = E(sel); drag = { x: e.clientX, y: e.clientY, dx: ed.dx, dy: ed.dy };
    scr.setPointerCapture?.(e.pointerId);
  }, true);
  addEventListener('pointermove', e => {
    if (!drag || !sel) return;
    const ed = E(sel);
    ed.dx = Math.round((drag.dx + (e.clientX - drag.x) / S.sx) * 2) / 2;
    ed.dy = Math.round((drag.dy + (e.clientY - drag.y) / S.sy) * 2) / 2;
    apply(sel); panel();
  });
  addEventListener('pointerup', () => { if (drag) { drag = null; save(); } });
  addEventListener('wheel', e => {
    if (!sel) return; e.preventDefault();
    const ed = E(sel); ed.k = Math.round(ed.k * (e.deltaY < 0 ? 1.02 : 1 / 1.02) * 1000) / 1000;
    apply(sel); save();
  }, { passive: false });
  addEventListener('keydown', e => {
    if (!sel) return;
    const m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key]; if (!m) return;
    e.preventDefault(); const st = e.shiftKey ? 5 : .5, ed = E(sel);
    ed.dx += m[0] * st; ed.dy += m[1] * st; apply(sel); save();
  });

  const p = document.createElement('div'); p.id = 'edp'; document.body.append(p);
  function panel() {
    const e = sel && (edits[sel] || { dx: 0, dy: 0, k: 1 });
    p.innerHTML = `<b>매칭 잡힘 편집</b><br><small>끌기 = 이동 · 휠 = 크기 · 방향키 = 0.5 (Shift 5)</small><br>
      ${sel ? `선택: <b>${sel}</b><br>가로 ${e.dx >= 0 ? '+' : ''}${e.dx} · 세로 ${e.dy >= 0 ? '+' : ''}${e.dy} · 크기 ×${e.k}` : '요소를 누르세요'}<br>
      <button id="e-r1">이 요소 원래대로</button><button id="e-ra">전체 원래대로</button><br>
      <button id="e-sc">${scene > 2 ? '불 보이는 장면' : '끝 장면'}</button><br>
      <small>바꾼 값은 자동 저장됩니다. 다 되면 채팅에 "다 했어"라고 알려 주세요.</small>`;
    p.querySelector('#e-r1').onclick = () => { if (sel) { delete edits[sel]; apply(sel); save(); } };
    p.querySelector('#e-ra').onclick = () => { edits = {}; applyAll(); save(); };
    p.querySelector('#e-sc').onclick = () => { scene = scene > 2 ? 1.5 : 3.6; freeze(); panel(); };
  }
  panel();
  window.__edits = () => edits;
})();
</script>
